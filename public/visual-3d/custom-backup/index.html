<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>3D Particle Visual</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05060a;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #app {
      position: fixed;
      inset: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: fixed;
      right: clamp(1.25rem, 4vw, 3.5rem);
      top: 50%;
      transform: translateY(-52%);
      z-index: 2;
      pointer-events: none;
      text-align: left;
      max-width: min(42vw, 420px);
    }
    #hud h1 {
      margin: 0;
      color: #d7dbe7;
      font-size: clamp(2rem, 4.8vw, 4.4rem);
      line-height: 0.95;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    #hud h1 span { display: block; }
    #hud .date {
      margin-top: 1rem;
      color: #5de7ff;
      font-size: clamp(1rem, 2vw, 1.55rem);
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    #hint {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%);
      color: rgba(220, 228, 240, 0.55);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 2;
      pointer-events: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #05060a;
      color: #9aa3b5;
      z-index: 5;
      transition: opacity 0.6s ease;
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    @media (max-width: 800px) {
      #hud {
        right: 1rem;
        left: 1rem;
        top: auto;
        bottom: 18vh;
        transform: none;
        max-width: none;
      }
      #hud h1 { font-size: clamp(1.8rem, 10vw, 2.8rem); }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="loading">Loading 3D scene…</div>
  <div id="app"></div>
  <div id="hud">
    <h1><span>Digital</span><span>Design</span><span>Days</span></h1>
    <div class="date">6–8 October 2024</div>
  </div>
  <div id="hint">Move your mouse · scroll to orbit</div>
  <script type="module" src="./scene.js"></script>
</body>
</html>
